spring.config.import=optional:file:../.env[.properties]

spring.datasource.url=${DEV_DATABASE_URL}
spring.datasource.username=${DEV_DATABASE_USERNAME}
spring.datasource.password=${DEV_DATABASE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.connection-timeout=30000

app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN}
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true

logging.level.com.dairyfarm=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=OFF
logging.level.org.springframework.security=WARN
app.jwt.secret=${JWT_SECRET:Gt3qr6Jelr1cHtRaAO4bBCkgdocTSzdBvN9OPzNE92s=}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.upload-dir=${UPLOAD_DIR:./uploads}
app.farm.time-zone=${FARM_TIME_ZONE:Asia/Kolkata}
app.reproduction.gestation-days=${GESTATION_DAYS:283}
app.reproduction.heat-cycle-days=${HEAT_CYCLE_DAYS:21}
app.reproduction.pregnancy-test-days=${PREGNANCY_TEST_DAYS:21}
app.reminders.default-time=${REMINDER_DEFAULT_TIME:09:00}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
springdoc.swagger-ui.path=/swagger-ui.html
